{# Heart button for liking a post. static/js/likes.js handles clicks and
   builds the same markup (likeButtonHTML) for posts added by Load More. #}
{% macro like_button(post) %}
<button type="button"
        class="like-btn"
        data-post-id="{{ post.id }}"
        aria-pressed="false">
  <svg class="like-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.9 4.5 7.3 4.5c2 0 3.5 1.1 4.7 2.7 1.2-1.6 2.7-2.7 4.7-2.7 3.4 0 5.7 3.3 4.5 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></svg>
  <span class="visually-hidden">Like</span>
  <span class="like-count">{{ post.likes }}</span>
</button>
{% endmacro %}
